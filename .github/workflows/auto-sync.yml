name: Auto Sync Fork

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: NousResearch/hermes-agent
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || true
          git fetch upstream ${UPSTREAM_BRANCH}
          git fetch origin ${TARGET_BRANCH}

      - name: Sync upstream into fork
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "dieutx"
          git config user.email "dieutx@users.noreply.github.com"

          git checkout ${TARGET_BRANCH}
          git rebase upstream/${UPSTREAM_BRANCH}

          git remote set-url origin https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push --force-with-lease origin ${TARGET_BRANCH}
